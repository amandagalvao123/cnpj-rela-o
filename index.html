<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de CNPJs — Grupo Ragga</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1FA;--card:#FFF;--brand:#2D204E;--brand2:#3D2F66;--brand-tint:#EEEBF6;--brand-tint2:#F5F3FB;--ink:#241C36;--muted:#6E6885;--faint:#9A95AC;--hair:#E7E4F0;--hair2:#F0EEF7;--green:#2F8B57;--green-bg:#E7F1EA;--green-ink:#1E6B41;--amber:#D69A2A;--amber-bg:#FBF1DC;--amber-ink:#8A6410;--red:#C24A3A;--red-bg:#F8E8E4;--red-ink:#9A3527;--blue:#3A6EA5;--blue-bg:#E6EEF6;--blue-ink:#28527A;--teal:#2A9D8F;--violet:#6C5CE7;--shadow:0 1px 2px rgba(45,32,78,.05),0 8px 24px rgba(45,32,78,.07);--radius:15px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 80px}h1,h2{font-weight:700;letter-spacing:-.01em}button{font-family:inherit}
a{color:var(--brand)}
header.top{background:linear-gradient(120deg,#2D204E,#4B2E6E 60%,#6C3A7A);color:#F4EFE5}
.top-in{max-width:1240px;margin:0 auto;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.top-l{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.logo-badge{background:#fff;border-radius:12px;padding:9px 13px;display:flex;align-items:center}.logo{height:34px;display:block}
.ttl h1{font-size:19px;margin:0;color:#fff}.ttl .sub{font-size:12.5px;color:#D8CCE8;margin-top:2px}
.snap{text-align:right;font-size:11.5px;color:#D8CCE8;line-height:1.5}.snap b{display:block;color:#fff;font-size:12.5px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0 8px}
.kpi{background:var(--card);border:1px solid var(--hair);border-radius:13px;padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;text-align:left;font:inherit;color:inherit;width:100%}
.kpi:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(45,32,78,.15);border-color:var(--kc)}
.kpi:focus-visible{outline:2.5px solid var(--kc);outline-offset:2px}
.kpi .go{position:absolute;top:11px;right:12px;color:var(--kc);opacity:0;transition:.14s;font-size:15px}
.kpi:hover .go{opacity:.8}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--brand))}
.kpi .lab{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .num{font-size:29px;font-weight:800;line-height:1;margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--kc,var(--ink))}
.kpi .foot{font-size:11px;color:var(--faint);margin-top:4px}
.tabs{display:flex;gap:5px;margin:22px 0 0;flex-wrap:wrap;border-bottom:2px solid var(--hair)}
.tab{border:none;background:none;padding:12px 15px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:7px;border-radius:8px 8px 0 0;transition:.14s}
.tab:hover{color:var(--brand);background:var(--brand-tint2)}.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab .cnt{font-size:11px;background:var(--brand-tint);color:var(--brand);border-radius:10px;padding:1px 7px;font-weight:700}.tab.on .cnt{background:var(--brand);color:#fff}
.filters{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px;margin-top:16px}
.frow{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:11px}.frow.b{grid-template-columns:2fr 1fr 1fr}
.field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:5px}
.field select,.field input{width:100%;padding:9px 11px;border:1px solid var(--hair);border-radius:9px;font:inherit;font-size:13.5px;background:var(--brand-tint2);color:var(--ink);appearance:none}
.field.sel{position:relative}.field.sel::after{content:"";position:absolute;right:12px;bottom:14px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.field select:focus,.field input:focus{outline:2px solid var(--brand);border-color:transparent;background:#fff}
.field.search{position:relative}.field.search input{padding-left:34px}.field.search svg{position:absolute;left:11px;bottom:11px;opacity:.4}
.frow3{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.chipset{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chipset .cl{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:700;margin-right:2px}
.chip{border:1px solid var(--hair);background:#fff;border-radius:18px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);transition:.13s}
.chip:hover{border-color:var(--brand2)}.chip.on{color:#fff;border-color:transparent;background:var(--brand)}
.chip.on.c-green{background:var(--green)}.chip.on.c-amber{background:var(--amber)}.chip.on.c-red{background:var(--red)}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--hair);background:#fff;border-radius:9px;padding:8px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--brand);display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--brand-tint)}.btn.pri{background:var(--brand);color:#fff;border-color:transparent}.btn.pri:hover{background:var(--brand2)}
.btn.g{background:var(--green);color:#fff;border-color:transparent}.btn.g:hover{filter:brightness(.94)}
.ov{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-top:16px}
.ov h3{margin:0 0 13px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ovbar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:11px;margin-bottom:8px;cursor:pointer}
.ovbar .l{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.ovbar:hover .l{color:var(--brand)}
.ovtrack{height:11px;background:var(--hair2);border-radius:6px;overflow:hidden}.ovfill{height:100%;border-radius:6px;transition:width .5s}
.ovbar .n{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.sec-lab{font-size:12px;color:var(--muted);margin:20px 0 8px;font-weight:700}
.acc{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden;border-left:5px solid var(--ac,var(--brand))}
.acc.open{box-shadow:0 10px 30px rgba(45,32,78,.13)}
.acc-head{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:16px 19px;background:none;border:none;cursor:pointer;text-align:left;color:inherit}
.acc-head:hover,.acc.open .acc-head{background:var(--brand-tint2)}
.acc-nm{font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.01em;color:var(--ink);display:flex;align-items:center;gap:9px}
.acc-dot{width:11px;height:11px;border-radius:50%;background:var(--ac,var(--brand));flex:none}.acc-sub{font-size:12px;color:var(--muted);margin-top:2px}
.acc-r{display:flex;align-items:center;gap:13px;flex:none}.acc-num{font-size:29px;font-weight:800;color:var(--ac,var(--brand));font-variant-numeric:tabular-nums;line-height:1}
.chev{color:var(--muted);transition:transform .25s}.acc.open .chev{transform:rotate(180deg);color:var(--brand)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}.acc.open .acc-body{grid-template-rows:1fr}.acc-inner{overflow:hidden;min-height:0}
.grp-wrap{border-top:1px solid var(--hair2);padding:6px 0 10px}.grp{margin:10px 14px 0;border:1px solid var(--hair);border-radius:11px;overflow:hidden}
.grp.gopen{border-color:var(--gc,var(--brand2))}
.grp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:11px 15px;background:var(--gcbg,var(--brand-tint2));border:none;border-left:4px solid var(--gc,var(--brand));cursor:pointer;text-align:left;color:inherit}
.grp-name{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--gc,var(--brand))}
.grp-r{display:flex;align-items:center;gap:12px}.grp-num{display:flex;align-items:baseline;gap:5px;font-size:25px;font-weight:800;color:var(--gc,var(--brand));font-variant-numeric:tabular-nums;line-height:1}
.grp-num span{font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--faint)}.gchev{color:var(--muted);transition:transform .25s;flex:none}.grp.gopen .gchev{transform:rotate(180deg)}
.grp-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}.grp.gopen .grp-body{grid-template-rows:1fr}.grp-inner{overflow:hidden;min-height:0;padding:4px 0}
.loja-grp{padding:8px 15px 10px}.loja-grp+.loja-grp{border-top:1px solid var(--hair2)}
.loja-name{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);margin-bottom:6px}
.loja-ct{font-size:10px;font-weight:700;color:var(--muted);background:var(--hair2);border-radius:10px;padding:1px 7px}
.doclink{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--brand);text-decoration:none;display:inline-flex;align-items:center;gap:4px;background:var(--brand-tint);padding:3px 9px;border-radius:6px}
.doclink:hover{background:var(--brand);color:#fff}
.cnpj-list{display:flex;flex-direction:column;gap:2px}
.cnpj-row{display:grid;grid-template-columns:26px 186px 1fr auto;align-items:center;gap:10px;padding:5px 8px;border-radius:8px}
.cnpj-row:hover{background:var(--brand-tint2)}
.cbtn{border:none;background:transparent;cursor:pointer;color:var(--faint);padding:4px;border-radius:6px;display:flex;align-items:center;justify-content:center}.cbtn:hover{background:var(--brand-tint);color:var(--brand)}
.cnpj{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;cursor:pointer;border:none;background:transparent;color:var(--brand);font-weight:600;padding:3px 6px;border-radius:6px;text-align:left}.cnpj:hover{background:var(--brand-tint)}
.razao{font-size:13px;color:var(--ink);cursor:pointer;padding:3px 6px;border-radius:6px;border:none;background:transparent;text-align:left;width:100%}.razao:hover{background:var(--brand-tint);color:var(--brand)}
.rowtags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.gtag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;white-space:nowrap;background:var(--gtb);color:var(--gtc)}
.tg-sit-ativo{background:var(--green-bg);color:var(--green-ink)}.tg-sit-reserva{background:var(--amber-bg);color:var(--amber-ink)}.tg-sit-desativar{background:var(--red-bg);color:var(--red-ink)}
.tg-mf{background:var(--blue-bg);color:var(--blue-ink)}.tg-ifood{background:var(--red-bg);color:var(--red-ink)}
.iconbtn{border:none;background:transparent;cursor:pointer;color:var(--faint);padding:4px;border-radius:6px;display:inline-flex}.iconbtn:hover{background:var(--brand-tint);color:var(--brand)}.iconbtn.del:hover{background:var(--red-bg);color:var(--red)}
.lst-card{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:16px;overflow:hidden}
.lst-top{padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand-tint2);border-bottom:1px solid var(--hair)}
.lst-top .c{font-size:13px;color:var(--muted)}.lst-top .c b{color:var(--ink)}
.tbl-scroll{overflow-x:auto}table.lst{width:100%;border-collapse:collapse;font-size:12.5px;min-width:940px}
table.lst thead th{position:sticky;top:0;background:#fff;text-align:left;padding:10px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid var(--hair);font-weight:700;white-space:nowrap}
table.lst tbody td{padding:9px 12px;border-bottom:1px solid var(--hair2);vertical-align:middle}table.lst tbody tr:hover{background:var(--brand-tint2)}
table.lst .cnpjc{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--brand);font-weight:600;cursor:pointer;white-space:nowrap}table.lst .rz{cursor:pointer;max-width:230px}
table.lst .cnpjc:hover,table.lst .rz:hover{text-decoration:underline}
.gpill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;color:#fff}.npill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;color:#fff}
.doc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
.doc{background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border-top:4px solid var(--brand)}
.doc-h{padding:15px 18px;background:var(--brand-tint2);border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;gap:10px}
.doc-h .nm{font-size:15px;font-weight:800;color:var(--brand)}.doc-h .ro{font-size:11px;color:var(--muted);margin-top:1px}
.doc-b{padding:8px 12px}.drow{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:8px;padding:7px 6px;border-radius:8px}.drow:hover{background:var(--brand-tint2)}.drow+.drow{border-top:1px solid var(--hair2)}
.drow .k{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700}.drow .v{font-size:13.5px;color:var(--ink);word-break:break-word}.drow .v.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
/* folder cards */
.fold-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:16px}
.foldc{display:block;background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;text-decoration:none;color:inherit;transition:.15s;border-left:5px solid var(--brand)}
.foldc:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(45,32,78,.14)}
.foldc .ic{font-size:26px}.foldc .t{font-weight:800;font-size:15px;color:var(--brand);margin-top:8px}.foldc .d{font-size:12px;color:var(--muted);margin-top:3px}
.loja-fold{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.lf{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:11px 13px;text-decoration:none;color:var(--ink);font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.lf:hover{border-color:var(--brand);background:var(--brand-tint2)}.lf .fic{color:var(--brand)}
/* ifood */
.ifsum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.ifk{background:var(--card);border:1px solid var(--hair);border-radius:13px;padding:14px;box-shadow:var(--shadow);border-left:4px solid var(--kc)}
.ifk .n{font-size:26px;font-weight:800;color:var(--kc);line-height:1}.ifk .l{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:5px}
.ifrow{display:grid;grid-template-columns:1.15fr 1.5fr 1.15fr auto;gap:12px;align-items:center;padding:9px 10px;border-radius:9px}
.ifrow:hover{background:var(--brand-tint2)}.ifrow.radaroff{opacity:.72;border-left:3px solid var(--red);padding-left:8px;background:linear-gradient(90deg,rgba(194,74,58,.05),transparent)}.ifrow .plat{font-size:12.5px;font-weight:600}.ifrow .rz{font-size:12px;color:var(--muted)}
.ifbank{background:var(--brand-tint2);border-radius:8px;padding:6px 9px}.ifbank .bk-lab{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:800;display:block}.ifbank .bk-v{font-size:11.5px;color:var(--ink);margin-top:2px;line-height:1.4}.ifbank .bkc{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--brand);font-weight:700;border:none;background:transparent;cursor:pointer;padding:1px 4px;border-radius:5px}.ifbank .bkc:hover{background:var(--brand-tint)}
.ifstatus{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.conta-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 14px;border-radius:9px}.conta-row+.conta-row{border-top:1px solid var(--hair2)}.conta-row:hover{background:var(--brand-tint2)}
.conta-emp{font-weight:700;font-size:13px}.conta-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.conta-acc{text-align:right;min-width:150px}.bankpill{font-size:10px;font-weight:800;padding:3px 9px;border-radius:5px;color:#fff;white-space:nowrap}
.conta-acc .cta{font-size:12.5px;color:var(--ink);margin-top:5px}.conta-acc .bkc{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--brand);border:none;background:transparent;cursor:pointer;padding:1px 5px;border-radius:5px}.conta-acc .bkc:hover{background:var(--brand-tint)}
@media(max-width:640px){.conta-row{grid-template-columns:1fr}.conta-acc{text-align:left;min-width:0;margin-top:6px}}
.ifarrow{font-size:11px;color:var(--green-ink);font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.empty{padding:44px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:16px;font-weight:700;margin-bottom:4px}
footer.pg{margin-top:26px;padding-top:16px;border-top:1px solid var(--hair);font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.hide{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brand);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(45,32,78,.3);opacity:0;pointer-events:none;transition:.25s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* modal */
.ov-bg{position:fixed;inset:0;background:rgba(36,28,54,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:70;opacity:0;pointer-events:none;transition:.2s}
.ov-bg.show{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:620px;max-height:90vh;overflow:auto}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
.modal-h h3{margin:0;font-size:17px;color:var(--brand)}
.modal-b{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.mf{display:flex;flex-direction:column}.mf.full{grid-column:1/-1}
.mf label{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.mf input,.mf select,.mf textarea{padding:9px 11px;border:1px solid var(--hair);border-radius:9px;font:inherit;font-size:13.5px;background:var(--brand-tint2);color:var(--ink)}
.mf input:focus,.mf select:focus,.mf textarea:focus{outline:2px solid var(--brand);border-color:transparent;background:#fff}
.modal-f{padding:16px 22px;border-top:1px solid var(--hair);display:flex;gap:10px;justify-content:space-between;position:sticky;bottom:0;background:#fff}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.frow,.frow.b{grid-template-columns:1fr 1fr}.doc-grid{grid-template-columns:1fr}.fold-grid{grid-template-columns:1fr}.ifsum{grid-template-columns:1fr 1fr}.loja-fold{grid-template-columns:1fr 1fr}.modal-b{grid-template-columns:1fr}}
@media(max-width:640px){
  .cnpj-row{grid-template-columns:1fr auto;grid-template-areas:'cnpj cbtn' 'razao razao' 'tags tags';gap:3px 8px;padding:9px 8px;border-bottom:1px solid var(--hair2);border-radius:0}
  .cnpj-row .cbtn{grid-area:cbtn}.cnpj-row .cnpj{grid-area:cnpj;font-size:13px}
  .cnpj-row .razao{grid-area:razao;font-size:12.5px;color:var(--muted);padding-left:0}

function matchQ(r){return !f.q||(r.loja+" "+r.empresa+" "+r.cnpj+" "+r.grupo+" "+r.negocio+" "+(r.endereco||"")+" "+r.socio).toLowerCase().includes(f.q.toLowerCase())}
function pass(r,ex){return(ex==="socio"||!f.socio||r.socio===f.socio)&&(ex==="grupo"||!f.grupo||r.grupo===f.grupo)&&(ex==="neg"||!f.neg||r.negocio===f.neg)&&(ex==="loja"||!f.loja||r.loja===f.loja)&&(ex==="fin"||!f.fin||r.finalidade===f.fin)&&(ex==="mf"||!f.mf||r.mf===f.mf)&&(ex==="sit"||f.sit==="todos"||r.sit===f.sit)&&(ex==="q"||matchQ(r))}
function filtered(){return records.filter(r=>pass(r,null))}
function isForced(){return !!(f.socio||f.grupo||f.neg||f.loja||f.fin||f.mf||f.q||f.sit!=="todos")}

function fill(id,opts,val,all){document.getElementById(id).innerHTML=`<option value="">${all}</option>`+opts.map(o=>`<option value="${esc(o.v)}" ${val===o.v?"selected":""}>${esc(o.t)}</option>`).join("")}
function optCount(ex,key){const m={};records.filter(r=>pass(r,ex)).forEach(r=>{const k=r[key];if(k)m[k]=(m[k]||0)+1});return m}
function renderFilters(){
  let m=optCount("socio","socio");fill("fSocio",Object.keys(m).sort((a,b)=>m[b]-m[a]).map(k=>({v:k,t:`${k} (${m[k]})`})),f.socio,"Todos os sócios");
  m=optCount("grupo","grupo");fill("fGrupo",uniq(Object.keys(m)).map(k=>({v:k,t:`${k} (${m[k]})`})),f.grupo,"Todos os grupos");

  m=optCount("loja","loja");fill("fLoja",uniq(Object.keys(m)).map(k=>({v:k,t:`${k} (${m[k]})`})),f.loja,"Todas as lojas");
  m=optCount("fin","finalidade");fill("fFin",uniq(Object.keys(m)).map(k=>({v:k,t:`${k} (${m[k]})`})),f.fin,"Todas");
  m=optCount("mf","mf");fill("fMf",uniq(Object.keys(m)).map(k=>({v:k,t:`${k} (${m[k]})`})),f.mf,"Todos");

function renderSocioTab(){const rows=filtered(),bys={};rows.forEach(r=>{(bys[r.socio]=bys[r.socio]||[]).push(r)});

      <td class="rz" title="Copiar" onclick="copyTxt(this.dataset.v,'Razão social')" data-v="${esc(r.empresa)}">${r.empresa}</td>
      <td>${r.loja}${r.ifood==="SIM"?' <span class="tag tg-ifood">iFood</span>':''}</td>
      <td><span class="npill" style="background:${negCol(r.negocio)}">${r.negocio}</span></td>
      <td><span class="gpill" style="background:${grpCol(r.grupo)}">${r.grupo}</span></td>
      <td>${r.socio}</td><td><span class="tag tg-mf">${r.mf}</span></td><td>${r.finalidade}</td>
      <td><span class="tag tg-sit-${r.sit}">${SIT[r.sit].lab}</span></td>
      <td style="white-space:nowrap"><button class="iconbtn" title="Consultar na Receita" onclick="receita('${r.cnpj}')">${RCICON}</button><button class="iconbtn" title="Editar" onclick="openEdit('${r.id}')">${PEN}</button><button class="iconbtn del" title="Remover" onclick="delRec('${r.id}')">${TRASH}</button></td>
    </tr>`).join("")}</tbody></table></div>`:`<div class="empty"><b>Nenhum CNPJ encontrado</b>Ajuste os filtros.</div>`;
  document.getElementById("tabContent").innerHTML=`<div class="lst-card"><div class="lst-top"><div class="c">Exibindo <b>${rows.length}</b> de <b>${records.length}</b> CNPJs</div>
    <div class="tools"><button class="btn g" onclick="openNew()">＋ Novo</button><button class="btn" onclick="exportJSON()">⇧ Exportar dados</button><button class="btn" onclick="document.getElementById('importFile').click()">⇩ Importar</button><button class="btn" onclick="restoreBase()">↺ Restaurar base</button></div></div>${body}</div>`;
}
/* docs socios */
function renderDocs(){const h=SOCIOS.map((s,i)=>{const rows=[["Nome",s.nome,0],["Nascimento",s.nasc,0],["RG",s.rg,1],["CPF",s.cpf,1],["CNH",s.cnh,1],["Endereço",s.end,0]].filter(x=>x[1]).map(([k,v,mono])=>`<div class="drow"><div class="k">${k}</div><div class="v ${mono?"mono":""}">${v}</div><button class="cbtn" title="Copiar ${k}" onclick="copyTxt(this.closest('.drow').querySelector('.v').textContent,'${k}')">${CP}</button></div>`).join("");
  const role=s.key&&ROLE[s.key]?ROLE[s.key]:(s.obs||"Sócio / titular");
  return`<div class="doc"><div class="doc-h"><div><div class="nm">${s.nome}</div><div class="ro">${role}</div></div><button class="btn pri" onclick="copySocio(${i})">${CP} Copiar tudo</button></div><div class="doc-b">${rows}</div></div>`}).join("");
  document.getElementById("tabContent").innerHTML=`<div class="doc-grid">${h}</div>`}
function copySocio(i){const s=SOCIOS[i];const t=[`Nome: ${s.nome}`,s.nasc&&`Nascimento: ${s.nasc}`,s.rg&&`RG: ${s.rg}`,s.cpf&&`CPF: ${s.cpf}`,s.cnh&&`CNH: ${s.cnh}`,s.end&&`Endereço: ${s.end}`].filter(Boolean).join("\n");copyTxt(t,"Dados de "+s.nome)}
/* drive docs */
function renderDrive(){
  const main="https://drive.google.com/drive/folders/"+DRIVE.main;
  const top=`<div class="fold-grid">${DRIVE.top.map(fx=>`<a class="foldc" href="https://drive.google.com/drive/folders/${fx.id}" target="_blank" rel="noopener"><div class="ic">📁</div><div class="t">${fx.t}</div><div class="d">${fx.d}</div></a>`).join("")}</div>`;
  const lojas=Object.keys(DRIVE.loja).sort((a,b)=>a.localeCompare(b));
  const seen=new Set();const lojaCards=lojas.filter(l=>{const id=DRIVE.loja[l];if(seen.has(id+l))return false;return true}).map(l=>`<a class="lf" href="${driveLoja(l)}" target="_blank" rel="noopener"><span>${l}</span><span class="fic">${FOLD}</span></a>`).join("");
  document.getElementById("tabContent").innerHTML=`
    <div class="lst-card" style="padding:16px 18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><div style="font-weight:800;font-size:16px;color:var(--brand)">Documentos no Google Drive</div><div style="font-size:12.5px;color:var(--muted);margin-top:2px">Abre direto na pasta do Drive (login Ragga). Pastas principais e por loja.</div></div><a class="btn pri" href="${main}" target="_blank" rel="noopener">📂 Abrir pasta raiz</a></div></div>
    <div class="sec-lab">Pastas principais</div>${top}
    <div class="sec-lab">Documentos por loja (Ragga Restaurantes)</div><div class="loja-fold">${lojaCards}</div>`;
}
function renderContas(){
  let items=CONTAS.filter(x=>!contasQ||(x.loja+" "+x.empresa+" "+x.cnpj+" "+x.banco+" "+x.conta+" "+x.agencia).toLowerCase().includes(contasQ.toLowerCase()));
  const nB=uniq(CONTAS.map(x=>x.banco)).length,nL=uniq(CONTAS.map(x=>x.loja).filter(l=>l&&l!=="—")).length,nC=uniq(CONTAS.map(x=>x.cnpj)).length;
  const perBank={};CONTAS.forEach(x=>perBank[x.banco]=(perBank[x.banco]||0)+1);
  const sum=`<div class="ifsum">
    <div class="ifk" style="--kc:var(--brand)"><div class="n">${CONTAS.length}</div><div class="l">Contas bancárias</div></div>
    ${Object.keys(perBank).sort().map(bk=>`<div class="ifk" style="--kc:${bankCol(bk)}"><div class="n">${perBank[bk]}</div><div class="l">${bk}</div></div>`).join("")}
    <div class="ifk" style="--kc:var(--blue)"><div class="n">${nC}</div><div class="l">CNPJs · ${nL} lojas</div></div></div>`;
  const bar=`<div class="filters" style="margin-top:14px"><div class="frow3">
    <div class="field search" style="flex:1;min-width:220px;margin:0"><label>Busca</label><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="contasSearch" type="text" placeholder="Loja, empresa, CNPJ, conta…" value="${esc(contasQ)}"></div>
    <div class="chipset"><span class="cl">Agrupar por</span>${[["banco","Banco"],["loja","Loja"],["cnpj","CNPJ"]].map(a=>`<button class="chip ${contasGroup===a[0]?"on":""}" data-cg="${a[0]}">${a[1]}</button>`).join("")}</div></div></div>`;
  const key=contasGroup;
  const groups={};items.forEach(x=>{let k;if(key==="cnpj")k=(x.empresa||"—")+"||"+x.cnpj;else k=x[key]||"—";(groups[k]=groups[k]||[]).push(x)});
  const order=Object.keys(groups).sort((a,b)=>key==="banco"?groups[b].length-groups[a].length:a.localeCompare(b));
  const defOpen=(key==="banco");
  function contaRow(x){return`<div class="conta-row">
    <div><div class="conta-emp">${x.empresa||"—"}</div><div class="conta-meta">${x.loja&&x.loja!=="—"?`<span>${x.loja}</span> · `:""}<button class="cnpj" title="Copiar CNPJ" onclick="copyTxt('${x.cnpj}','CNPJ')">${x.cnpj}</button><button class="iconbtn" title="Consultar na Receita" onclick="receita('${x.cnpj}')">${RCICON}</button></div></div>
    <div class="conta-acc"><span class="bankpill" style="background:${bankCol(x.banco)}">${x.banco}</span><div class="cta">Ag ${x.agencia} · <button class="bkc" title="Copiar conta" onclick="copyTxt('${x.conta}','Conta')">${x.conta}</button></div></div>
  </div>`}
  const body=order.length?order.map(g=>{const rs=groups[g];const label=key==="cnpj"?g.split("||")[0]+" — "+g.split("||")[1]:g;const col=key==="banco"?bankCol(g):(key==="loja"?"#E4572E":"var(--brand)");const isOpen=defOpen||openGrp.has("cta:"+g);
    return`<div class="acc ${isOpen?"open":""}" style="--ac:${col}"><button class="acc-head" data-cta="cta:${esc(g)}"><div><div class="acc-nm"><span class="acc-dot"></span>${label}</div><div class="acc-sub">${rs.length} conta${rs.length>1?"s":""}${key!=="loja"?" · "+uniq(rs.map(r=>r.loja).filter(l=>l&&l!=="—")).length+" loja(s)":""}</div></div><div class="acc-r"><div class="acc-num" style="color:${col}">${rs.length}</div>${CHEV}</div></button><div class="acc-body"><div class="acc-inner"><div class="grp-wrap" style="padding:4px 6px">${rs.map(contaRow).join("")}</div></div></div></div>`}).join(""):`<div class="lst-card"><div class="empty"><b>Nenhuma conta</b>Ajuste a busca.</div></div>`;
  document.getElementById("tabContent").innerHTML=sum+bar+`<div style="margin-top:6px"></div>`+body;
  const si=document.getElementById("contasSearch");si.addEventListener("input",e=>{contasQ=e.target.value;renderContas();const n=document.getElementById("contasSearch");n.focus();n.setSelectionRange(n.value.length,n.value.length)});
  document.querySelectorAll("[data-cg]").forEach(b=>b.addEventListener("click",()=>{contasGroup=b.dataset.cg;openGrp=new Set();renderContas()}));
  document.querySelectorAll("[data-cta]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.cta;if(openGrp.has(k.slice(4)))openGrp.delete(k.slice(4));else openGrp.add(k.slice(4));renderContas()}));
}
/* modal CRUD */
let editingId=null;
function distinct(key){return uniq(records.map(r=>r[key]).filter(Boolean))}
function optionList(vals,cur){return vals.map(v=>`<option value="${esc(v)}" ${cur===v?"selected":""}>${esc(v)}</option>`).join("")}
function openModal(rec){editingId=rec?rec.id:null;
  document.getElementById("modalTitle").textContent=rec?"Editar CNPJ":"Novo CNPJ";
  document.getElementById("mDel").style.display=rec?"":"none";
  const r=rec||{cnpj:"",empresa:"",loja:"",negocio:"",grupo:"",socio:"",endereco:"",finalidade:"Compra e venda",sit:"ativo",ifood:"NÃO",mf:"",obs:""};
  const grupos=distinct("grupo"),negs=uniq([...distinct("negocio"),brandOf(r.loja)]);
  document.getElementById("modalBody").innerHTML=`
    <div class="mf full"><label>CNPJ</label><input id="m_cnpj" value="${esc(r.cnpj)}" placeholder="00.000.000/0001-00"></div>
    <div class="mf full"><label>Razão social</label><input id="m_empresa" value="${esc(r.empresa)}"></div>
    <div class="mf"><label>Loja</label><input id="m_loja" value="${esc(r.loja)}" list="lojalist"><datalist id="lojalist">${distinct("loja").map(v=>`<option value="${esc(v)}">`).join("")}</datalist></div>
    <div class="mf"><label>Grupo de negócio</label><input id="m_negocio" value="${esc(r.negocio)}" list="neglist" placeholder="(auto pela loja)"><datalist id="neglist">${negs.map(v=>`<option value="${esc(v)}">`).join("")}</datalist></div>
    <div class="mf"><label>Grupo administrativo</label><select id="m_grupo">${optionList(grupos,r.grupo)}<option value="__novo">+ outro…</option></select></div>
    <div class="mf"><label>Sócio</label><input id="m_socio" value="${esc(r.socio)}" list="soclist"><datalist id="soclist">${distinct("socio").map(v=>`<option value="${esc(v)}">`).join("")}</datalist></div>
    <div class="mf"><label>Finalidade fiscal</label><select id="m_fin">${FIN_OPTS.map(v=>`<option ${r.finalidade===v?"selected":""}>${v}</option>`).join("")}</select></div>
    <div class="mf"><label>Situação</label><select id="m_sit"><option value="ativo" ${r.sit==="ativo"?"selected":""}>Em uso</option><option value="reserva" ${r.sit==="reserva"?"selected":""}>Reserva</option><option value="desativar" ${r.sit==="desativar"?"selected":""}>Desativar</option></select></div>
    <div class="mf"><label>Matriz / Filial</label><select id="m_mf"><option value="">(auto pelo CNPJ)</option><option ${r.mf==="Matriz"?"selected":""}>Matriz</option><option ${r.mf==="Filial"?"selected":""}>Filial</option></select></div>
    <div class="mf"><label>iFood</label><select id="m_ifood"><option ${r.ifood==="SIM"?"selected":""}>SIM</option><option ${r.ifood!=="SIM"?"selected":""}>NÃO</option></select></div>
    <div class="mf full"><label>Endereço</label><input id="m_endereco" value="${esc(r.endereco)}"></div>
    <div class="mf full"><label>Observação</label><input id="m_obs" value="${esc(r.obs)}"></div>`;
  document.getElementById("modal").classList.add("show");
}
function openNew(){openModal(null)}
function openEdit(id){openModal(records.find(r=>r.id===id))}
function closeModal(){document.getElementById("modal").classList.remove("show");editingId=null}
function saveForm(){
  const g=(id)=>document.getElementById(id).value.trim();
  const cnpj=g("m_cnpj"),loja=g("m_loja");
  const rec={cnpj,empresa:g("m_empresa"),loja,negocio:g("m_negocio")||brandOf(loja),grupo:g("m_grupo"),socio:g("m_socio"),
    endereco:g("m_endereco"),finalidade:g("m_fin"),sit:g("m_sit"),ifood:g("m_ifood"),mf:g("m_mf")||mfOf(cnpj),obs:g("m_obs")};
  if(!cnpj&&!rec.empresa){toast("Informe ao menos CNPJ ou razão social");return}
  if(editingId){const i=records.findIndex(r=>r.id===editingId);records[i]={...records[i],...rec}}
  else records.push({...rec,id:nextId()});
  persist();closeModal();renderAll();toast(editingId?"CNPJ atualizado":"CNPJ adicionado")
}
function delRec(id){const r=records.find(x=>x.id===id);if(!confirm("Remover este CNPJ?\n\n"+(r?r.cnpj+" — "+r.empresa:"")))return;records=records.filter(x=>x.id!==id);persist();renderAll();toast("CNPJ removido")}
function delFromModal(){if(!editingId)return;const id=editingId;closeModal();delRec(id)}
function exportJSON(){const blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ragga_cnpj_dados_"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();toast("Backup JSON exportado")}
function restoreBase(){if(!confirm("Descartar suas alterações e voltar à base original?"))return;records=BASE.map((r,i)=>({...r,id:"b"+i}));persist();renderAll();toast("Base original restaurada")}
document.getElementById("importFile").addEventListener("change",e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const a=JSON.parse(rd.result);if(Array.isArray(a)&&a.length){records=a.map((r,i)=>({...r,id:r.id||("i"+i)}));persist();renderAll();toast(a.length+" CNPJs importados")}else toast("Arquivo inválido")}catch(err){toast("Erro ao ler o JSON")}};rd.readAsText(file);e.target.value=""});

function wireAcc(){document.querySelectorAll(".acc-head[data-s]:not([data-s^='if:'])").forEach(b=>b.addEventListener("click",()=>{const s=b.dataset.s;if(open.has(s))open.delete(s);else open.add(s);renderTab()}));
  document.querySelectorAll(".grp-head").forEach(b=>b.addEventListener("click",()=>{if(isForced())return;const k=b.dataset.gkey;if(openGrp.has(k))openGrp.delete(k);else openGrp.add(k);renderTab()}))}
function copyTxt(t,what){navigator.clipboard?.writeText(t).then(()=>toast((what||"Texto")+" copiado")).catch(()=>toast(t))}
function copyBoth(cnpj,el){const rz=el.closest(".cnpj-row,tr").querySelector(".razao,.rz");copyTxt(cnpj+"\t"+(rz?rz.dataset.v:""),"CNPJ + razão")}
let tT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),1700)}
function csvE(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}
function download(){const rows=filtered();const cols=[["CNPJ","cnpj"],["Razão social","empresa"],["Loja","loja"],["Grupo de negócio","negocio"],["Grupo administrativo","grupo"],["Sócio","socio"],["Matriz/Filial","mf"],["Finalidade","finalidade"],["Situação","sit"],["iFood","ifood"],["Endereço","endereco"],["Status planilha","status"],["Observação","obs"]];const sl={ativo:"Em uso",reserva:"Reserva",desativar:"Desativar"};let csv=cols.map(c=>csvE(c[0])).join(";")+"\r\n";rows.forEach(r=>{csv+=cols.map(c=>csvE(c[1]==="sit"?sl[r.sit]:r[c[1]])).join(";")+"\r\n"});const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="CNPJs_Ragga_filtro_"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();toast(rows.length+" CNPJs exportados")}

function renderTab(){if(tab==="socio")renderSocioTab();else if(tab==="negocio")renderNegocioTab();else if(tab==="fin")renderFinalidadeTab();else if(tab==="ifood")renderIfood();else if(tab==="lista")renderLista();else if(tab==="docs")renderDocs();else if(tab==="drive")renderDrive();else renderContas()}
function renderAll(){renderKpis();renderFilters();renderTab()}
function switchTab(name){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.tab===name));tab=name;document.getElementById("filterWrap").classList.toggle("hide",name==="docs"||name==="drive"||name==="contas")}
function scrollTabs(){window.scrollTo({top:document.querySelector(".tabs").offsetTop-10,behavior:"smooth"})}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{switchTab(t.dataset.tab);renderTab();scrollTabs()}));
function kpiAction(act){
  if(act==="alllist"){f={socio:"",grupo:"",neg:"",loja:"",fin:"",mf:"",sit:"todos",q:""};document.getElementById("fSearch").value="";switchTab("lista")}
  else if(act==="desativar"){f.sit="desativar";switchTab("lista")}
  else switchTab(act);
  renderAll();scrollTabs();
}
[["fSocio","socio"],["fGrupo","grupo"],["fNeg","neg"],["fLoja","loja"],["fFin","fin"],["fMf","mf"]].forEach(([id,k])=>document.getElementById(id).addEventListener("change",e=>{f[k]=e.target.value;renderAll()}));
document.getElementById("fSearch").addEventListener("input",e=>{f.q=e.target.value;renderAll();const n=document.getElementById("fSearch");n.focus();n.setSelectionRange(n.value.length,n.value.length)});
document.getElementById("clearAll").addEventListener("click",()=>{f={socio:"",grupo:"",neg:"",loja:"",fin:"",mf:"",sit:"todos",q:""};open=new Set();openGrp=new Set();document.getElementById("fSearch").value="";renderAll()});
document.getElementById("dl").addEventListener("click",download);
document.getElementById("bNew").addEventListener("click",openNew);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
renderAll();
</script></body></html>
